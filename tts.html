<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech - Thinksy</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tts-container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .tts-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .tts-textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 1.5rem;
            transition: var(--transition);
        }

        .tts-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-weight: 600;
            color: var(--dark);
        }

        .control-group select,
        .control-group input {
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-tts {
            flex: 1;
            min-width: 150px;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }

        .btn-speak {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-speak:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .btn-stop:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
        }

        .btn-clear {
            background: #6b7280;
            color: white;
        }

        .btn-clear:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(107, 114, 128, 0.3);
        }

        .status {
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            font-weight: 500;
            display: none;
        }

        .status.active {
            display: block;
        }

        .status.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎓 Thinksy</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#features">Features</a></li>
            </ul>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
        </div>
    </nav>

    <!-- TTS Container -->
    <div class="tts-container">
        <h1 class="tts-title">🔊 Text to Speech</h1>
        
        <textarea 
            class="tts-textarea" 
            id="textInput" 
            rows="8" 
            placeholder="Paste your notes here and click 'Speak' to listen...">
        </textarea>

        <div class="controls">
            <div class="control-group">
                <label for="voiceSelect">Voice:</label>
                <select id="voiceSelect"></select>
            </div>
            <div class="control-group">
                <label for="speedSlider">Speed: <span id="speedValue">1</span>x</label>
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>

        <div class="button-group">
            <button class="btn-tts btn-speak" onclick="speakText()">▶ Speak</button>
            <button class="btn-tts btn-stop" onclick="stopSpeech()">⏹ Stop</button>
            <button class="btn-tts btn-clear" onclick="clearText()">🗑 Clear</button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Thinksy | Built for Students</p>
    </footer>

    <script>
        let utterance;

        // Populate voice options
        function populateVoices() {
            const voiceSelect = document.getElementById('voiceSelect');
            const voices = window.speechSynthesis.getVoices();
            
            voiceSelect.innerHTML = '';
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
        }

        window.speechSynthesis.onvoiceschanged = populateVoices;
        populateVoices();

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status active ${type}`;
        }

        function speakText() {
            const text = document.getElementById('textInput').value.trim();
            
            if (!text) {
                showStatus('❌ Please enter some text first!', 'error');
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            utterance = new SpeechSynthesisUtterance(text);
            const voiceSelect = document.getElementById('voiceSelect');
            const speedSlider = document.getElementById('speedSlider');
            
            utterance.voice = window.speechSynthesis.getVoices()[voiceSelect.value];
            utterance.rate = parseFloat(speedSlider.value);
            utterance.pitch = 1;
            utterance.volume = 1;

            utterance.onstart = () => {
                showStatus('🔊 Speaking... Click Stop to pause', 'info');
            };

            utterance.onend = () => {
                showStatus('✅ Finished speaking!', 'success');
                document.getElementById('progressFill').style.width = '100%';
            };

            utterance.onerror = () => {
                showStatus('❌ Error during speech synthesis', 'error');
            };

            window.speechSynthesis.speak(utterance);
            showStatus('▶ Now playing...', 'info');
        }

        function stopSpeech() {
            window.speechSynthesis.cancel();
            showStatus('⏹ Stopped', 'info');
            document.getElementById('progressFill').style.width = '0%';
        }

        function clearText() {
            document.getElementById('textInput').value = '';
            window.speechSynthesis.cancel();
            document.getElementById('status').classList.remove('active');
            document.getElementById('progressFill').style.width = '0%';
        }

        // Update speed display
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            document.getElementById('speedValue').textContent = e.target.value;
        });

        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'light';

        function applyTheme(theme) {
            root.setAttribute('data-theme', theme);
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', theme);
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = root.getAttribute('data-theme') || 'light';
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(nextTheme);
        });

        applyTheme(savedTheme);
    </script>

</body>
</html>
