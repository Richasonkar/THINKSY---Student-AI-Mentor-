<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Generator - AI Study Mentor</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .quiz-container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .quiz-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .quiz-section {
            display: none;
        }

        .quiz-section.active {
            display: block;
            animation: slideInUp 0.5s ease;
        }

        /* Input Section */
        .input-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        .input-group textarea,
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: var(--transition);
        }

        .input-group textarea:focus,
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 150px;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-quiz {
            flex: 1;
            min-width: 150px;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Quiz Display */
        .quiz-display {
            padding: 2rem;
        }

        .question-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            border-left: 4px solid var(--primary);
        }

        .question-number {
            font-size: 0.9rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--dark);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 1rem;
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .option:hover {
            border-color: var(--primary);
            background: #f9fafb;
        }

        .option input[type="radio"] {
            margin-right: 1rem;
            cursor: pointer;
            width: 20px;
            height: 20px;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            margin: 0;
        }

        .option.correct {
            background: #dcfce7;
            border-color: #22c55e;
        }

        .option.incorrect {
            background: #fee2e2;
            border-color: #ef4444;
        }

        .progress-container {
            margin-bottom: 2rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 0.5rem;
        }

        /* Navigation */
        .quiz-navigation {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn-nav {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-prev {
            background: #6b7280;
            color: white;
        }

        .btn-prev:hover:not(:disabled) {
            transform: translateY(-3px);
        }

        .btn-prev:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-next {
            background: var(--primary);
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            width: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        /* Results */
        .results-section {
            text-align: center;
            padding: 3rem 2rem;
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 1rem 0;
        }

        .score-message {
            font-size: 1.3rem;
            color: var(--dark);
            margin-bottom: 2rem;
        }

        .performance-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .stat {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1.5rem;
            border-radius: 10px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .status {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            display: none;
        }

        .status.active {
            display: block;
        }

        .status.loading {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">🎓 AI Study Mentor</h1>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#features">Features</a></li>
                <li><a href="index.html#dashboard">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <!-- Quiz Container -->
    <div class="quiz-container">
        <h1 class="quiz-title">❓ Quiz Generator</h1>

        <!-- Input Section -->
        <div class="quiz-section active" id="inputSection">
            <div class="input-section">
                <div class="input-group">
                    <label for="topicInput">📚 Enter Topic or Paste Notes:</label>
                    <textarea id="topicInput" placeholder="Enter the topic or paste your notes here..."></textarea>
                </div>

                <div class="input-group">
                    <label for="questionCount">❓ Number of Questions:</label>
                    <select id="questionCount">
                        <option value="5">5 Questions</option>
                        <option value="10" selected>10 Questions</option>
                        <option value="15">15 Questions</option>
                        <option value="20">20 Questions</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="difficulty">🎯 Difficulty Level:</label>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

                <div class="button-group">
                    <button class="btn-quiz btn-generate" onclick="generateQuiz()">🚀 Generate Quiz</button>
                </div>
            </div>
            <div class="status" id="status"></div>
        </div>

        <!-- Quiz Display Section -->
        <div class="quiz-section" id="quizSection">
            <div class="progress-container">
                <div class="progress-text">
                    Question <span id="currentQuestion">1</span> of <span id="totalQuestions">10</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div id="quizContent"></div>

            <div class="quiz-navigation">
                <button class="btn-nav btn-prev" onclick="previousQuestion()" id="prevBtn">← Previous</button>
                <button class="btn-nav btn-next" onclick="nextQuestion()" id="nextBtn">Next →</button>
                <button class="btn-nav btn-submit" onclick="submitQuiz()" id="submitBtn" style="display:none;">Submit Quiz</button>
            </div>
        </div>

        <!-- Results Section -->
        <div class="quiz-section" id="resultsSection">
            <div class="results-section">
                <h2>🎉 Quiz Complete!</h2>
                <div class="score-display" id="scoreDisplay">85%</div>
                <div class="score-message" id="scoreMessage">Great Job! You got it right!</div>

                <div class="performance-stats">
                    <div class="stat">
                        <div class="stat-value" id="correctCount">8</div>
                        <div class="stat-label">Correct</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="incorrectCount">2</div>
                        <div class="stat-label">Incorrect</div>
                    </div>
                    <div class="stat">
                        <div class="stat-value" id="scorePercentage">85%</div>
                        <div class="stat-label">Score</div>
                    </div>
                </div>

                <div id="reviewSection"></div>

                <button class="btn-quiz btn-generate" onclick="resetQuiz()" style="margin-top: 2rem;">← Start Over</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 AI Study Mentor | Built for Students</p>
    </footer>

    <script>
        let quizData = [];
        let currentQuestionIndex = 0;
        let answers = [];

        // Sample quiz questions (you can replace this with API calls)
        const sampleQuestions = {
            biology: [
                {
                    question: "What is the powerhouse of the cell?",
                    options: ["Nucleus", "Mitochondria", "Ribosome", "Chloroplast"],
                    correct: 1
                },
                {
                    question: "Which process do plants use to make food?",
                    options: ["Respiration", "Photosynthesis", "Digestion", "Fermentation"],
                    correct: 1
                },
                {
                    question: "How many chambers does a human heart have?",
                    options: ["2", "3", "4", "5"],
                    correct: 2
                }
            ],
            history: [
                {
                    question: "In which year did World War II end?",
                    options: ["1943", "1944", "1945", "1946"],
                    correct: 2
                },
                {
                    question: "Who was the first President of the United States?",
                    options: ["Thomas Jefferson", "George Washington", "John Adams", "Benjamin Franklin"],
                    correct: 1
                }
            ],
            math: [
                {
                    question: "What is 15 × 8?",
                    options: ["100", "110", "120", "130"],
                    correct: 2
                },
                {
                    question: "What is the square root of 144?",
                    options: ["10", "11", "12", "13"],
                    correct: 2
                }
            ]
        };

        function generateQuestions(topic, count, difficulty) {
            const questions = [];
            const topicKey = topic.toLowerCase().split(' ')[0];
            const sampleQs = sampleQuestions[topicKey] || sampleQuestions.biology;

            for (let i = 0; i < count; i++) {
                const baseQuestion = sampleQs[i % sampleQs.length];
                questions.push({
                    question: baseQuestion.question,
                    options: baseQuestion.options.sort(() => Math.random() - 0.5),
                    correct: baseQuestion.options.indexOf(sampleQs[i % sampleQs.length].options[baseQuestion.correct])
                });
            }
            return questions;
        }

        function generateQuiz() {
            const topic = document.getElementById('topicInput').value.trim();
            const count = parseInt(document.getElementById('questionCount').value);
            const difficulty = document.getElementById('difficulty').value;

            if (!topic) {
                showStatus('❌ Please enter a topic or paste notes!', 'error');
                return;
            }

            showStatus('⏳ Generating quiz...', 'loading');
            
            setTimeout(() => {
                quizData = generateQuestions(topic, count, difficulty);
                answers = new Array(count).fill(null);
                currentQuestionIndex = 0;
                displayQuiz();
                document.getElementById('inputSection').classList.remove('active');
                document.getElementById('quizSection').classList.add('active');
            }, 1000);
        }

        function displayQuiz() {
            const question = quizData[currentQuestionIndex];
            const quizContent = document.getElementById('quizContent');
            
            let html = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestionIndex + 1}</div>
                    <div class="question-text">${question.question}</div>
                    <div class="options">
            `;

            question.options.forEach((option, index) => {
                html += `
                    <label class="option">
                        <input type="radio" name="answer" value="${index}" 
                            ${answers[currentQuestionIndex] === index ? 'checked' : ''}
                            onchange="answers[${currentQuestionIndex}] = ${index}">
                        <label>${option}</label>
                    </label>
                `;
            });

            html += `</div></div>`;
            quizContent.innerHTML = html;

            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('totalQuestions').textContent = quizData.length;
            
            const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').style.display = currentQuestionIndex === quizData.length - 1 ? 'none' : 'block';
            document.getElementById('submitBtn').style.display = currentQuestionIndex === quizData.length - 1 ? 'block' : 'none';
        }

        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                displayQuiz();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuiz();
            }
        }

        function submitQuiz() {
            let correct = 0;
            quizData.forEach((q, index) => {
                if (answers[index] === q.correct) correct++;
            });

            const percentage = Math.round((correct / quizData.length) * 100);
            
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('incorrectCount').textContent = quizData.length - correct;
            document.getElementById('scorePercentage').textContent = percentage + '%';
            document.getElementById('scoreDisplay').textContent = percentage + '%';

            if (percentage >= 80) {
                document.getElementById('scoreMessage').textContent = '🌟 Excellent! You mastered this topic!';
            } else if (percentage >= 60) {
                document.getElementById('scoreMessage').textContent = '👍 Good job! Keep practicing!';
            } else {
                document.getElementById('scoreMessage').textContent = '💪 Keep learning! You\'ll get better!';
            }

            document.getElementById('quizSection').classList.remove('active');
            document.getElementById('resultsSection').classList.add('active');
        }

        function resetQuiz() {
            document.getElementById('topicInput').value = '';
            quizData = [];
            answers = [];
            currentQuestionIndex = 0;
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('inputSection').classList.add('active');
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status active ${type}`;
            setTimeout(() => status.classList.remove('active'), 3000);
        }
    </script>

</body>
</html>
